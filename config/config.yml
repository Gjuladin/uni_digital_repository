ui:
  # Safe tracked defaults: local development must never contact a deployed site.
  ssl: false
  host: localhost
  port: 4000
  baseUrl: http://localhost:4000
  nameSpace: /
  useProxies: true

rest:
  # Browser REST endpoint. Override explicitly for staging/production.
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

ssr:
  replaceRestUrl: true

# Deployment configuration is deliberately not tracked here. DSpace resolves
# these at runtime (or from an external DSPACE_APP_CONFIG_PATH):
# DSPACE_UI_BASEURL=https://public.example.org
# DSPACE_REST_SSL=true, DSPACE_REST_HOST=public-rest.example.org,
# DSPACE_REST_PORT=443, DSPACE_REST_NAMESPACE=/server
# DSPACE_REST_SSRBASEURL=http://internal-rest:8080/server
# Keep ssr.replaceRestUrl=true whenever REST_SSRBASEURL is internal so it is
# rewritten to the browser REST URL before SSR HTML is sent to clients.

info:
  enableCOARNotifySupport: false

themes:
  - name: uist
    extends: dspace
    prefetch: true
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/images/favicon.ico
          sizes: any
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/images/apple-touch-icon.png

addToAnyPlugin:
  socialNetworksEnabled: false
  scriptUrl: https://static.addtoany.com/menu/page.js
  buttons:
    - facebook
    - x
    - linkedin
    - email
    - copy_link
  showPlusButton: true
  showCounters: true
  title: UIST Digital Repository
