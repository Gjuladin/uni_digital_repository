ui:
  # Safe tracked defaults: local development must never contact a deployed site.
  ssl: false
  host: localhost
  port: 4000
  baseUrl: http://localhost:4000
  nameSpace: /
  useProxies: true

rest:
  # Browser REST endpoint. Override explicitly for staging/production.
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

ssr:
  replaceRestUrl: true

# Deployment configuration is deliberately not tracked here. DSpace resolves
# these at runtime (or from an external DSPACE_APP_CONFIG_PATH):
# DSPACE_UI_BASEURL=https://public.example.org
# DSPACE_REST_SSL=true, DSPACE_REST_HOST=public-rest.example.org,
# DSPACE_REST_PORT=443, DSPACE_REST_NAMESPACE=/server
# DSPACE_REST_SSRBASEURL=http://internal-rest:8080/server
# Keep ssr.replaceRestUrl=true whenever REST_SSRBASEURL is internal so it is
# rewritten to the browser REST URL before SSR HTML is sent to clients.

info:
  enableCOARNotifySupport: false
  # Publish the simplified UIST pages requested by the repository operator.
  # This controls public pages, not deposit approval workflows or registry claims.
  repositoryPolicyPublication:
    enabled: true
    version: '2026-10-06-simple'

fallbackLanguage: en

languages:
  - code: en
    label: English
    active: true

harvesting:
  enabled: true
  repository:
    name: UIST Digital Repository
    description: UIST Digital Repository is the institutional repository of the University of
      Information Science and Technology "St. Paul the Apostle" in Ohrid, North
      Macedonia. Established in 2025. University-funded. It preserves and shares
      research datasets and supporting documentation, publications, theses and
      other scholarly outputs. Research areas include computer science,
      artificial intelligence, data science, cybersecurity, engineering,
      economics and online learning. Public descriptive metadata is available
      under CC0; access and reuse of files follow each record's stated terms.
    languages:
      - en
    subjects:
      - Computer science
      - Artificial intelligence
      - Data science
      - Cybersecurity
      - Engineering
      - Economics
      - Online learning
      - Language learning
    publisher:
      id: https://uist.edu.mk/#organization
      name: University of Information Science and Technology "St. Paul the Apostle"
      url: https://uist.edu.mk/
      countryCode: { enabled: true, value: 'MK' }
    # Accepted policies and contact were verified publicly on 7 October 2026.
    # The consolidated policy covers deposit, access, curation and preservation.
    # Its reuse terms distinguish CC0 descriptive metadata from file-specific rights.
    contactEmail: { enabled: true, value: 'pavel.taskov@uist.edu.mk' }
    contactName: { enabled: true, value: 'Pavel Taskov' }
    contactUrl: { enabled: true, value: 'https://repository.uist.edu.mk/info/contact' }
    # Catalog metadata only; item/file licences are supplied by their records.
    licenseUrl: { enabled: true, value: 'https://creativecommons.org/publicdomain/zero/1.0/' }
    accessRightsUrl: { enabled: true, value: 'https://repository.uist.edu.mk/info/repository-policies#access-and-file-reuse' }
    depositPolicyUrl: { enabled: true, value: 'https://repository.uist.edu.mk/info/repository-policies#content-and-deposit' }
    preservationPolicyUrl: { enabled: true, value: 'https://repository.uist.edu.mk/info/repository-policies#retention-and-service-continuity' }
    curationPolicyUrl: { enabled: true, value: 'https://repository.uist.edu.mk/info/repository-policies#metadata-reuse-and-curation' }
    privacyPolicyUrl: { enabled: true, value: 'https://repository.uist.edu.mk/info/privacy' }
    # Launch year and funding status confirmed by the repository owner on 28 October 2026.
    establishedYear: { enabled: true, value: '2025' }
    fundingStatement: { enabled: true, value: 'University-funded' }
    funderId: { enabled: true, value: 'https://uist.edu.mk/#organization' }
    # Public registry identity verified against the canonical repository URL.
    re3dataId: { enabled: true, value: 'https://www.re3data.org/repository/r3d100014963' }
    # DOI of the registry record describing UIST, not an item/dataset DOI.
    re3dataDoi: { enabled: true, value: 'https://doi.org/10.17616/R31NJO1F' }
    # Candidate FAIRsharing record 9313 is recorded as awaiting curator review.
    # Its public page did not identify UIST on recheck; populate after verification.
    fairsharingId: { enabled: true, value: '' }
  services:
    rest: true
    oaiPmh: true
    openSearch: true
    feeds: true
    sitemap: true
    signposting: true

themes:
  - name: uist
    extends: dspace
    prefetch: true
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/images/favicon.ico
          sizes: any
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/images/apple-touch-icon.png

addToAnyPlugin:
  socialNetworksEnabled: false
  scriptUrl: https://static.addtoany.com/menu/page.js
  buttons:
    - facebook
    - x
    - linkedin
    - email
    - copy_link
  showPlusButton: true
  showCounters: true
  title: UIST Digital Repository
