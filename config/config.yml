ui:
  # Safe tracked defaults: local development must never contact a deployed site.
  ssl: false
  host: localhost
  port: 4000
  baseUrl: http://localhost:4000
  nameSpace: /
  useProxies: true

rest:
  # Browser REST endpoint. Override explicitly for staging/production.
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

ssr:
  replaceRestUrl: true

# Deployment configuration is deliberately not tracked here. DSpace resolves
# these at runtime (or from an external DSPACE_APP_CONFIG_PATH):
# DSPACE_UI_BASEURL=https://public.example.org
# DSPACE_REST_SSL=true, DSPACE_REST_HOST=public-rest.example.org,
# DSPACE_REST_PORT=443, DSPACE_REST_NAMESPACE=/server
# DSPACE_REST_SSRBASEURL=http://internal-rest:8080/server
# Keep ssr.replaceRestUrl=true whenever REST_SSRBASEURL is internal so it is
# rewritten to the browser REST URL before SSR HTML is sent to clients.

info:
  enableCOARNotifySupport: false
  # Publish the simplified UIST pages requested by the repository operator.
  # This controls public pages, not deposit approval workflows or registry claims.
  repositoryPolicyPublication:
    enabled: true
    version: '2026-10-06-simple'

fallbackLanguage: en

languages:
  - code: en
    label: English
    active: true

harvesting:
  enabled: true
  repository:
    name: UIST Digital Repository
    description: UIST's institutional repository supports the preservation and sharing of research datasets and supporting documentation, alongside publications, theses and other scholarly outputs from Ohrid, North Macedonia.
    languages:
      - en
    subjects: []
    publisher:
      id: https://uist.edu.mk/#organization
      name: University of Information Science and Technology "St. Paul the Apostle"
      url: https://uist.edu.mk/
      # countryCode: { enabled: false, value: '' }
    # Governance and registry claims are intentionally omitted until approved.
    # Optional claims use { enabled: true, value: ... } and are omitted otherwise.
    # These machine-readable claims are separate from the bundled public pages.
    # Enable actual public policy URLs after deploying and verifying the pages.
    # contactEmail: { enabled: false, value: '' }
    # licenseUrl: { enabled: false, value: '' }
    # accessRightsUrl: { enabled: false, value: '' }
    # depositPolicyUrl: { enabled: false, value: '' }
    # preservationPolicyUrl: { enabled: false, value: '' }
    # curationPolicyUrl: { enabled: false, value: '' }
    # re3dataId: { enabled: false, value: '' }
    # fairsharingId: { enabled: false, value: '' }
  services:
    rest: true
    oaiPmh: true
    openSearch: true
    feeds: true
    sitemap: true
    signposting: true

themes:
  - name: uist
    extends: dspace
    prefetch: true
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/images/favicon.ico
          sizes: any
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/images/apple-touch-icon.png

addToAnyPlugin:
  socialNetworksEnabled: false
  scriptUrl: https://static.addtoany.com/menu/page.js
  buttons:
    - facebook
    - x
    - linkedin
    - email
    - copy_link
  showPlusButton: true
  showCounters: true
  title: UIST Digital Repository
