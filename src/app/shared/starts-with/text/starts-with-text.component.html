<form class="w-100" [formGroup]="formData" (ngSubmit)="submitForm(formData.value)">
<div class="mb-3">
  <div class="row">
    <div class="mb-3 input-group col-sm-12 col-md-6 col-auto">
      <input class="form-control"
        [attr.aria-label]="(supportsContains ? 'browse.search-form.placeholder' : 'browse.startsWith.input') | translate"
        [placeholder]="(supportsContains ? 'browse.search-form.placeholder' : 'browse.startsWith.type_text') | translate"
        type="text"
        [attr.name]="supportsContains ? 'contains' : 'startsWith'"
        formControlName="startsWith"
        [value]="getStartsWith()" />
        <button class="btn btn-primary" type="submit" role="button" tabindex="0"><i class="fas fa-book-open"></i> {{'browse.startsWith.submit' | translate}}</button>
    </div>
  </div>
</div>
</form>
