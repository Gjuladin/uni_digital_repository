<div>
  <div class="modal-header" id="idle-modal.header">{{ "idle-modal.header" | translate }}
    <button type="button" class="btn-close" (click)="closePressed()" [attr.aria-label]="'ui.close' | translate">
    </button>
  </div>
  <div class="modal-body">
    <p>{{ "idle-modal.info" | translate:{timeToExpire: timeToExpire} }}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="cancel btn btn-danger" (click)="logOutPressed()" [attr.aria-label]="'ui.log-out' | translate">
      <i class="fas fa-sign-out-alt"></i> {{ "idle-modal.log-out" | translate }}
    </button>
    <button type="button" class="confirm btn btn-primary" (click)="extendSessionPressed()" [attr.aria-label]="'ui.extend-session' | translate" ngbAutofocus>
      <i class="fas fa-redo-alt"></i> {{ "idle-modal.extend-session" | translate }}
    </button>
  </div>
</div>
