<div class="container mt-4">
  <div class="card mx-auto" style="max-width: 34rem;">
    <div class="card-header">
      <h1 class="h3 mb-0">{{ 'password-change.title' | translate }}</h1>
    </div>
    <div class="card-body">
      <p>{{ 'password-change.instructions' | translate }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="current-password">{{ 'password-change.current' | translate }}</label>
          <div class="input-group">
            <input id="current-password" class="form-control" [type]="showCurrentPassword ? 'text' : 'password'"
              formControlName="currentPassword" autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility('currentPassword')"
              [attr.aria-label]="(showCurrentPassword ? 'password-change.hide-password' : 'password-change.show-password') | translate">
              <i class="fa fa-fw" [class.fa-eye-slash]="showCurrentPassword" [class.fa-eye]="!showCurrentPassword"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="new-password">{{ 'password-change.new' | translate }}</label>
          <div class="input-group">
            <input id="new-password" class="form-control" [type]="showNewPassword ? 'text' : 'password'"
              formControlName="newPassword" autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility('newPassword')"
              [attr.aria-label]="(showNewPassword ? 'password-change.hide-password' : 'password-change.show-password') | translate">
              <i class="fa fa-fw" [class.fa-eye-slash]="showNewPassword" [class.fa-eye]="!showNewPassword"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="confirmation">{{ 'password-change.confirm' | translate }}</label>
          <div class="input-group">
            <input id="confirmation" class="form-control" [type]="showConfirmation ? 'text' : 'password'"
              formControlName="confirmation" autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility('confirmation')"
              [attr.aria-label]="(showConfirmation ? 'password-change.hide-password' : 'password-change.show-password') | translate">
              <i class="fa fa-fw" [class.fa-eye-slash]="showConfirmation" [class.fa-eye]="!showConfirmation"></i>
            </button>
          </div>
        </div>

        @if (error) {
          <div class="alert alert-danger" role="alert">{{ error | translate }}</div>
        }

        <button class="btn btn-primary" [dsBtnDisabled]="saving" type="submit">
          {{ (passwordChanged ? 'password-change.continue' : 'password-change.submit') | translate }}
        </button>
      </form>
    </div>
  </div>
</div>
