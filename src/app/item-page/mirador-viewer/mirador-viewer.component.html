@if (isIiifEnabled$ | async) {
  <p class="full-text-op">{{'iiifviewer.fullscreen.notice' | translate}}</p>
  @if (!isViewerAvailable) {
    <p id="viewer-message">{{ viewerMessage | translate }}</p>
  }
  @if (isViewerAvailable) {
    <iframe [attr.title]="'ui.mirador-viewer' | translate" allowtransparency="true" [src]="iframeViewerUrl | async" id="mirador-viewer"></iframe>
  }
}
